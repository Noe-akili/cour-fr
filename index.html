<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cours complet Tauri 2 : Rust, Vue 3, Yarn, SQLite, sécurité, tests et distribution."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfcfd" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Tauri 2 — Le cours complet</title>
    <script>
      // Appliqué avant le premier rendu pour éviter le flash de thème.
      (function () {
        try {
          var saved = localStorage.getItem("tauricours-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0d141b" : "#fbfcfd");
        } catch (error) {
          /* localStorage indisponible : on garde le thème clair. */
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>

    <div class="reading-progress" aria-hidden="true">
      <span id="reading-progress-bar"></span>
    </div>

    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation du cours">
        <div class="brand">
          <a class="brand-link" href="#/" data-home>
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" role="img">
                <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#g)" />
                <path d="M9 11h14M16 11v12" stroke="#071018" stroke-width="3" stroke-linecap="round" />
                <circle cx="25" cy="24" r="2.4" fill="#FFC131" />
                <defs>
                  <linearGradient id="g" x1="4" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#35C6DA" />
                    <stop offset="1" stop-color="#0D7D8F" />
                  </linearGradient>
                </defs>
              </svg>
            </span>
            <span class="brand-text">
              <strong>Tauri 2</strong>
              <small>Le cours complet</small>
            </span>
          </a>
        </div>

        <button class="search-trigger" id="search-trigger" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m16.5 16.5 4 4" />
          </svg>
          <span>Rechercher dans le cours</span>
          <kbd>Ctrl K</kbd>
        </button>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span>v1.0 · novembre 2026</span>
          <span class="sidebar-footer-tech">Rust + Vue 3</span>
        </div>
      </aside>

      <div class="nav-scrim" id="nav-scrim" hidden></div>

      <div class="main">
        <header class="topbar">
          <button
            class="icon-btn menu-btn"
            id="menu-btn"
            type="button"
            aria-label="Ouvrir la navigation"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>

          <nav class="breadcrumb" id="breadcrumb" aria-label="Fil d'Ariane"></nav>

          <div class="topbar-actions">
            <button class="search-trigger topbar-search" id="search-trigger-top" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m16.5 16.5 4 4" />
              </svg>
              <span>Rechercher</span>
            </button>

            <button
              class="icon-btn theme-btn"
              id="theme-btn"
              type="button"
              aria-label="Basculer le thème"
              title="Basculer le thème"
            >
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4.2" />
                <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.2 15.2A8.4 8.4 0 0 1 8.8 3.8a8.4 8.4 0 1 0 11.4 11.4Z" />
              </svg>
            </button>
          </div>
        </header>

        <div class="content-layout">
          <main class="article-wrap" id="contenu">
            <div class="page-head" id="page-head"></div>
            <article class="article" id="article"></article>
            <nav class="page-nav" id="page-nav" aria-label="Navigation entre les pages"></nav>
          </main>

          <aside class="toc" id="toc" aria-label="Sommaire de la page">
            <div class="toc-inner">
              <p class="toc-title">Sur cette page</p>
              <div id="toc-links"></div>
            </div>
          </aside>
        </div>

        <footer class="site-footer">
          <p>
            Cours Tauri 2 · Rust, Vue 3 et Yarn ·
            <a href="https://v2.tauri.app" target="_blank" rel="noopener">Documentation officielle</a>
          </p>
          <p class="site-footer-note">Les données restent sur votre machine.</p>
        </footer>
      </div>
    </div>

    <div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Recherche">
      <div class="search-dialog">
        <div class="search-input-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m16.5 16.5 4 4" />
          </svg>
          <input
            class="search-input"
            id="search-input"
            type="search"
            placeholder="Rechercher un chapitre, une commande, un concept…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Rechercher dans le cours"
          />
          <kbd class="search-escape">Échap</kbd>
        </div>
        <div class="search-results" id="search-results" aria-live="polite"></div>
        <div class="search-footer">
          <span><kbd>↑</kbd><kbd>↓</kbd> naviguer</span>
          <span><kbd>Entrée</kbd> ouvrir</span>
          <span><kbd>Échap</kbd> fermer</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
